<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro · Biblioteca UTR</title>
<link rel="icon" type="image/png" href="../../img/UTRLOGO.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=JetBrains+Mono:wght@400&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
<div class="pantalla-centrada">
  <div class="card">
    <div class="card__head">
      <img class="logo" src="../../img/UTRLOGO.png" alt="Logotipo de la Universidad Tecnológica El Retoño">
      <h1>Crear cuenta</h1>
      <p class="card__sub">Completa tus datos según tu tipo de usuario.</p>
    </div>

    <form action="login.html" method="get">
      <input class="rol-radio" type="radio" name="rol_registro" id="reg-est" value="alumno" checked>
      <input class="rol-radio" type="radio" name="rol_registro" id="reg-inv" value="externo">
      <input class="rol-radio" type="radio" name="rol_registro" id="reg-adm" value="administrador">

      <div class="tabs tabs--radio" role="tablist" aria-label="Tipo de usuario a registrar">
        <label class="tab" for="reg-est">Alumno</label>
        <label class="tab" for="reg-inv">Invitado</label>
        
      </div>

      <!-- Panel Alumno -->
      <div class="panel panel--est">
        <div class="field">
          <label for="est-reg-id">Matrícula / ID de usuario</label>
          <input class="mono" id="est-reg-id" name="user_id" type="text" inputmode="numeric" placeholder="Ej. 5483" required>
        </div>
        <div class="field">
          <label for="est-reg-nombre">Nombre completo</label>
          <input id="est-reg-nombre" name="full_name" type="text" maxlength="120" placeholder="Ej. Sofía Hernández López" required>
        </div>
        <div class="field">
          <label for="est-reg-genero">Género</label>
          <select id="est-reg-genero" name="gender" required>
            <option value="" selected disabled>Selecciona género</option>
            <option value="F">Femenino (F)</option>
            <option value="M">Masculino (M)</option>
          </select>
        </div>
        <div class="field">
          <label for="est-reg-carrera">Carrera</label>
          <select id="est-reg-carrera" name="major" required>
            <option value="" selected disabled>Selecciona tu carrera</option>
            <option value="TDSM">TDSM</option>
            <option value="CDIA">CDIA</option>
            <option value="IMT">IMT</option>
            <option value="TMKT">TMKT</option>
            <option value="IDGS">IDGS</option>
            <option value="LI">LI</option>
            <option value="ITI">ITI</option>
          </select>
        </div>
        <div class="field">
          <label for="est-reg-cuatri">Cuatrimestre</label>
          <input class="mono" id="est-reg-cuatri" name="quarter" type="number" min="1" max="11" placeholder="1 a 11" required>
          <p class="help">Permitido entre 1 y 11.</p>
        </div>
        <div class="field">
          <label for="est-reg-pw">Contraseña</label>
          <input id="est-reg-pw" name="password" type="password" maxlength="100" placeholder="Crea una contraseña" required>
        </div>
      </div>

      <!-- Panel Invitado (Externo: sin contraseña, teléfono obligatorio) -->
      <div class="panel panel--inv">
        <div class="field">
          <label for="inv-reg-id">ID de visitante externo</label>
          <input class="mono" id="inv-reg-id" name="user_id" type="text" inputmode="numeric" placeholder="Ej. 9002" required>
        </div>
        <div class="field">
          <label for="inv-reg-nombre">Nombre completo</label>
          <input id="inv-reg-nombre" name="full_name" type="text" maxlength="120" placeholder="Ej. Mariana Ortega" required>
        </div>
        <div class="field">
          <label for="inv-reg-tel">Teléfono de contacto</label>
          <input class="mono" id="inv-reg-tel" name="phone" type="tel" inputmode="tel" maxlength="20" placeholder="Ej. 4491234567" required>
          <p class="help">Los usuarios externos no usan contraseña.</p>
        </div>
      </div>

      

      <button class="btn" type="submit">Registrarse</button>
    </form>

    <p class="card__foot">¿Ya tienes cuenta? <a class="link" href="login.html">Inicia sesión</a></p>
  </div>
</div>
</body>
</html>
